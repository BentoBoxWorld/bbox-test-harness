# Known BentoBox addons and their GitHub repos.
# Used by fetch_jars.py to download the latest release JAR for each.

# Paper Minecraft versions to run the integration tests against.
# Add or remove entries here to change the matrix — no workflow edits needed.
minecraft_versions:
  - "1.21.5"
  - "1.21.7"
  - "1.21.8"
  - "1.21.10"
  - "1.21.11"
  - "26.1.2"
  - "26.2"

bentobox:
  repo: BentoBoxWorld/BentoBox

addons:
  - name: AcidIsland
    repo: BentoBoxWorld/AcidIsland

  - name: AOneBlock
    repo: BentoBoxWorld/AOneBlock

  - name: Bank
    repo: BentoBoxWorld/Bank

  - name: Biomes
    repo: BentoBoxWorld/Biomes

  - name: Border
    repo: BentoBoxWorld/Border

  - name: Boxed
    repo: BentoBoxWorld/Boxed

  - name: BSkyBlock
    repo: BentoBoxWorld/BSkyBlock

  - name: CauldronWitchery
    repo: BentoBoxWorld/CauldronWitchery

  - name: CaveBlock
    repo: BentoBoxWorld/CaveBlock
    # CaveBlock now targets Minecraft API 1.21.11 and refuses to load on older
    # servers. When the server's MC version is below this, the harness treats
    # CaveBlock's load/world/command checks as SKIPPED (a warning), not failures.
    min_api: "1.21.11"

  - name: Challenges
    repo: BentoBoxWorld/Challenges

  - name: Chat
    repo: BentoBoxWorld/Chat

  - name: CheckMeOut
    repo: BentoBoxWorld/CheckMeOut

  - name: ChunkBlock
    repo: BentoBoxWorld/ChunkBlock

  - name: ControlPanel
    repo: BentoBoxWorld/ControlPanel

  - name: DimensionalTrees
    repo: BentoBoxWorld/DimensionalTrees

  - name: ExtraMobs
    repo: BentoBoxWorld/ExtraMobs

  - name: FarmersDance
    repo: BentoBoxWorld/FarmersDance

  - name: Greenhouses
    repo: BentoBoxWorld/Greenhouses

  - name: InvSwitcher
    repo: BentoBoxWorld/InvSwitcher

  - name: IslandFly
    repo: BentoBoxWorld/IslandFly

  - name: Level
    repo: BentoBoxWorld/Level

  - name: Likes
    repo: BentoBoxWorld/Likes

  - name: Limits
    repo: BentoBoxWorld/Limits

  - name: MagicCobblestoneGenerator
    repo: BentoBoxWorld/MagicCobblestoneGenerator

  - name: Parkour
    repo: BentoBoxWorld/Parkour

  - name: Poseidon
    repo: BentoBoxWorld/Poseidon

  - name: SkyGrid
    repo: BentoBoxWorld/SkyGrid

  - name: StrangerRealms
    repo: BentoBoxWorld/StrangerRealms

  - name: TradeWinds
    repo: BentoBoxWorld/TradeWinds
    # TradeWinds uses the Adventure Dialog API (net.kyori.adventure.dialog.DialogLike),
    # which first ships with Paper 1.21.6. On older servers it throws
    # NoClassDefFoundError during onEnable, so the harness skips its checks there.
    min_api: "1.21.6"

  - name: TwerkingForTrees
    repo: BentoBoxWorld/TwerkingForTrees

  - name: Visit
    repo: BentoBoxWorld/Visit

  - name: VoidPortals
    repo: BentoBoxWorld/VoidPortals

  - name: Warps
    repo: BentoBoxWorld/Warps

# Known-benign log lines that must not fail `test_no_console_errors`.
# Each entry is a regex matched against the whole log line, plus the reason it
# is safe to ignore. Always record the reason: an unexplained whitelist decays
# into "ignore everything" and the suite goes quietly blind.
#
# The runner prints a per-pattern hit count on every run, so a pattern that has
# started swallowing far more than it should is visible in the CI output.
log_whitelist:
  - pattern: "Unknown listing in blocks section:"
    reason: >
      Level's blocks config is written for current Minecraft, so on older
      servers in the matrix it lists materials that do not exist yet (shelves,
      the copper/oxidation family, cinnabar and sulfur, the new spawners).
      98 hits on 1.21.7, zero on 26.2 — it tracks server age, not a defect.

  - pattern: "Bad block material in "
    reason: >
      Same class as above, from AOneBlock's phase config (e.g. DRIED_GHAST,
      which is 1.21.6+ content). Only fires on servers older than the addon.

  - pattern: "Item \\w+ has quantity \\d+ which exceeds max \\d+\\. Clamping to"
    reason: >
      BentoBox core clamps oversized stack counts in shipped blueprints
      (RED_MUSHROOM 100, BASALT/SOUL_SAND 128) against the 99 cap. Cosmetic —
      it reports the fix it already applied.

  - pattern: "The error 'No key layers in MapLike\\[\\{\\}\\]' is normal and not an error"
    reason: Poseidon says so itself in the message — it is world-gen noise.

  - pattern: "depends on development version of BentoBox plugin"
    reason: >
      Expected here by design: the harness deliberately runs addon releases
      against the newest BentoBox, which is what this warns about.

  - pattern: "has its own Border, so do not use Border addon"
    reason: >
      StrangerRealms advising against the Border addon. The harness loads all
      33 addons together on purpose, so this combination is expected.

  - pattern: "No blueprint bundles found! Creating a default one\\."
    reason: First-boot informational message from BentoBox core, mis-levelled as ERROR.

  # --- Known upstream bugs. These are REAL, not benign. They are listed here
  # --- only so a pre-existing defect does not hold the whole matrix red; delete
  # --- each entry once the upstream fix ships, so the suite starts guarding it.
  - pattern: "Mob chances add up to > 100% in \\w+ biome recipe!"
    reason: >
      KNOWN BUG (Greenhouses): shipped biomes.yml has PLAINS mob weights summing
      over 100%, so SHEEP is dropped. Fires on every MC version — not version
      drift. Remove this entry when Greenhouses fixes its config.

  - pattern: "Duplicate locale file '[^']+': '[^']+' already exists"
    reason: >
      KNOWN BUG (Border): ships both zh_CN.yml and zh-CN.yml, so one is ignored.
      Remove this entry when Border drops the underscore version.

server_plugins:
  - name: Vault
    repo: MilkBowl/Vault
  - name: EssentialsX
    repo: EssentialsX/Essentials
    asset_prefix: EssentialsX-
