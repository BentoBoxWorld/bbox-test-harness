name: BentoBox Integration Tests

on:
  # Run manually, optionally specifying a BentoBox JAR
  workflow_dispatch:
    inputs:
      bentobox_version:
        description: "BentoBox JAR to test (leave blank for latest CI build)"
        required: false

  # Nightly test against latest addon releases
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily

jobs:
  # Read minecraft_versions from addons.yml and expose as a JSON matrix.
  # To add/remove versions, edit addons.yml — no workflow changes needed.
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Read versions from addons.yml
        id: get-versions
        run: |
          versions=$(python3 -c "
          import yaml, json
          with open('addons.yml') as f:
              cfg = yaml.safe_load(f)
          print(json.dumps(cfg['minecraft_versions']))
          ")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  integration-test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false  # run all versions even if one fails
      matrix:
        mc_version: ${{ fromJson(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Download latest release JARs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_jars.py \
            --output-dir plugins \
            --config addons.yml

      - name: List downloaded plugins
        run: |
          ls -lh plugins/
          ls -lh plugins/BentoBox/addons/

      - name: Start Paper ${{ matrix.mc_version }} server
        env:
          MC_VERSION: ${{ matrix.mc_version }}
          CONTAINER_NAME: bbox-test-${{ matrix.mc_version }}
        run: |
          docker compose up -d
          echo "Server container started (MC ${{ matrix.mc_version }})"

      - name: Run integration tests
        env:
          MC_VERSION: ${{ matrix.mc_version }}
          CONTAINER_NAME: bbox-test-${{ matrix.mc_version }}
        run: |
          python scripts/run_tests.py \
            --host localhost \
            --port 25575 \
            --password bbox-test-harness \
            --container bbox-test-${{ matrix.mc_version }} \
            --log-file /tmp/bbox-server-${{ matrix.mc_version }}.log \
            --config addons.yml \
            --junit-output /tmp/junit-results-${{ matrix.mc_version }}.xml \
            --timeout 600

      - name: Collect server log
        if: always()
        run: |
          docker logs bbox-test-${{ matrix.mc_version }} \
            > /tmp/bbox-server-${{ matrix.mc_version }}.log 2>&1 || true

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.mc_version }}
          path: /tmp/junit-results-${{ matrix.mc_version }}.xml

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.mc_version }}
          path: /tmp/bbox-server-${{ matrix.mc_version }}.log

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests — MC ${{ matrix.mc_version }}
          path: /tmp/junit-results-${{ matrix.mc_version }}.xml
          reporter: java-junit

      - name: Stop server
        if: always()
        env:
          MC_VERSION: ${{ matrix.mc_version }}
          CONTAINER_NAME: bbox-test-${{ matrix.mc_version }}
        run: docker compose down -v
